name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan new findings against the base commit
        if: github.event_name != 'schedule'
        env:
          SEMGREP_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --baseline-commit "$SEMGREP_BASELINE" --error --sarif --output semgrep.sarif
      - name: Build the scheduled full-repository inventory
        if: github.event_name == 'schedule'
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --sarif --output semgrep.sarif
      - name: Summarize blocking findings
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("semgrep.sarif")
          if not report_path.is_file():
              print("Semgrep did not produce a SARIF report.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          results = [
              result
              for run in report.get("runs", [])
              for result in run.get("results", [])
          ]
          print(f"Blocking Semgrep findings: {len(results)}")
          for result in results:
              location = (result.get("locations") or [{}])[0]
              physical = location.get("physicalLocation", {})
              artifact = physical.get("artifactLocation", {}).get("uri", "unknown")
              line = physical.get("region", {}).get("startLine", "?")
              print(f"- {result.get('ruleId', 'unknown')} — {artifact}:{line}")
          PY
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: actions/setup-node@v4
        with:
          node-version: "24.7.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@v3
