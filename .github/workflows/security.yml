name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan new findings against the base commit
        if: github.event_name != 'schedule'
        env:
          SEMGREP_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --baseline-commit "$SEMGREP_BASELINE" --error --sarif --output semgrep.sarif
      - name: Build the scheduled full-repository inventory
        if: github.event_name == 'schedule'
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --sarif --output semgrep.sarif
      - name: Summarize blocking findings
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("semgrep.sarif")
          if not report_path.is_file():
              print("Semgrep did not produce a SARIF report.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          results = [
              result
              for run in report.get("runs", [])
              for result in run.get("results", [])
          ]
          print(f"Blocking Semgrep findings: {len(results)}")
          for result in results:
              location = (result.get("locations") or [{}])[0]
              physical = location.get("physicalLocation", {})
              artifact = physical.get("artifactLocation", {}).get("uri", "unknown")
              line = physical.get("region", {}).get("startLine", "?")
              print(f"- {result.get('ruleId', 'unknown')} — {artifact}:{line}")
          PY
      - name: Upload Semgrep SARIF when GitHub Code Security is available
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: ${{ always() && github.event.repository.private == false }}
        with:
          sarif_file: semgrep.sarif

  codeql:
    # The CodeQL CLI license and SARIF upload are not available for this
    # personal private repository. Keep this job ready for a licensed GitHub
    # Code Security plan; Semgrep remains the blocking SAST gate meanwhile.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.7.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
