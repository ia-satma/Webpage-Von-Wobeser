name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.7.0"
          cache: npm
      - name: Install video validation runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run test:security
      - run: npm run test:performance
      - run: npm run build
      - run: npm run verify:build-evidence
      - name: Preserve SBOM and build provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence-${{ github.sha }}
          path: |
            dist/sbom.cdx.json
            dist/build-provenance.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run audit:high
