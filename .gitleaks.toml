title = "Von Wobeser secret scanning configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

# Gitleaks interpreta el identificador CMS `ga4_measurement_id` como una clave
# genérica. Es el nombre de un campo editable vacío, no el Measurement ID ni una
# credencial. La excepción exige simultáneamente regla, ruta y secreto exactos.
[[allowlists]]
description = "GA4 CMS field identifier (not a credential)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^ga4_measurement_id$''']
paths = [
  '''^server/mirror/siteConfig\.ts$''',
  '''^client/src/pages/admin/AdminSiteConfig\.tsx$''',
  '''^client/src/features/admin/site-config/registry\.ts$''',
]

# La regla genérica interpreta objetos CMS `{ key, value }` como pares de
# credencial. Estas tres claves contienen únicamente etiquetas públicas del CTA.
# La excepción queda limitada a la regla, ruta y nombres de campo exactos.
[[allowlists]]
description = "Firm CTA label records (public copy, not credentials)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''key:\s*"firm_landing_cta_[123]_label"''']
paths = ['''^server/mirror/siteConfig\.ts$''']
